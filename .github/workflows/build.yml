# Builds dinput8.dll from this repository on GitHub's own machine, so nobody has to trust a build made on the
# author's PC, and checks it: the build is reproducible, so the SHA-256 must equal the one in dinput8.dll.sha256
# (the hash of the DLL released on the Steam Workshop for this version). A mismatch fails the run.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write      # attach the DLL to a release
  id-token: write      # signed build provenance (attestation)
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the compiler (llvm-mingw 20261006)
        shell: pwsh
        run: |
          # pinned version and checksum, so the build always uses exactly this compiler
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip'
          $sha = '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a'
          Invoke-WebRequest $url -OutFile llvm.zip
          $got = (Get-FileHash llvm.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "llvm.zip: checksum $got does not match $sha" }
          Expand-Archive llvm.zip "$env:RUNNER_TEMP\llvm"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\llvm\llvm-mingw-20261006-ucrt-x86_64\bin"

      - name: Build
        shell: cmd
        run: build.bat

      - name: SHA-256 and check against the released DLL
        shell: pwsh
        run: |
          $h = (Get-FileHash build\dinput8.dll -Algorithm SHA256).Hash.ToLower()
          $want = (Get-Content dinput8.dll.sha256 -Raw).Trim().Split()[0].ToLower()
          "SHA-256 of dinput8.dll: $h"
          "expected (dinput8.dll.sha256): $want"
          $ok = $h -eq $want
          "### dinput8.dll`nSHA-256: ``$h```n`nExpected: ``$want`` - " + ($(if ($ok) { 'matches the released DLL' } else { '**DOES NOT MATCH**' })) |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (-not $ok) { throw "the build does not reproduce the released DLL" }

      - uses: actions/upload-artifact@v4
        with:
          name: dinput8
          path: build/dinput8.dll

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: build/dinput8.dll

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build\dinput8.dll --clobber
